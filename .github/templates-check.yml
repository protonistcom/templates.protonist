# The quick check on a pull request of protonistcom/templates.protonist. Copy this file to `.github/workflows/templates-check.yml` there.
#
# It runs on pull requests from forks, so it has no secrets and needs no private repository: everything it uses is public. It must stay that
# way. The checks that need the blog's private repositories (the build, the budgets, structured data) run on Protonist's own runner and report
# as the check run "Protonist template check"; this workflow cannot replace or fake that one.
#
# Authors with read access to the blog run the full checker on their own computer (`yarn templates:check my-template`); this workflow only does
# the structural part that needs nothing from the blog.
name: Templates check

on:
  pull_request:

# a pull request from a fork gets a read-only token and no secrets, and this file asks for nothing more
permissions:
  contents: read

concurrency:
  group: templates-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A pull request changes one template folder and nothing else
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          folders="$(printf '%s\n' "$changed" | awk -F/ 'NF > 1 { print $1 }' | sort -u)"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/|[^/]+$)'; then
            echo "::error::A pull request may only change files inside one template folder (not .github/ and not files at the top of the repository)."; exit 1
          fi
          if [ "$(printf '%s\n' "$folders" | wc -l)" -gt 1 ]; then
            echo "::error::A pull request changes one template folder. This one touches: $(echo $folders)"; exit 1
          fi
          if git ls-tree -r "$HEAD" | awk '$1 == "120000"' | grep -q .; then
            echo "::error::Symbolic links are not allowed."; exit 1
          fi
          echo "FOLDER=$folders" >> "$GITHUB_ENV"

      - name: The folder is a template
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, readdirSync, statSync } from "node:fs"
            const dir = process.env.FOLDER
            const fail = (message) => { console.error(`::error::${message}`); process.exit(1) }
            if (!/^[a-z][a-z0-9-]{2,39}$/.test(dir)) fail(`The folder name is the template key: 3 to 40 lower case letters, digits and dashes, starting with a letter. "${dir}" is not.`)
            if (["classic", "signal", "default", "template", "preview", "custom", "protonist"].includes(dir)) fail(`"${dir}" is a reserved key.`)
            if (!existsSync(`${dir}/manifest.json`)) fail("The folder has no manifest.json.")
            let manifest
            try { manifest = JSON.parse(readFileSync(`${dir}/manifest.json`, "utf8")) } catch { fail("manifest.json is not valid JSON.") }
            if (!/^\d+\.\d+\.\d+$/.test(String(manifest.version))) fail("manifest.json needs a version of three numbers, like 1.0.0.")
            if (!/^\^?\d+\.\d+/.test(String(manifest.sdk))) fail("manifest.json needs the SDK range the template works with, like ^2.0.")
            if (!manifest.store?.title?.en) fail("manifest.json needs store.title with an English text.")
            const preview = readdirSync(dir).find((name) => /^preview\.(png|jpe?g|webp)$/.test(name))
            if (!preview) fail("The folder needs a preview picture: preview.png, preview.jpg or preview.webp.")
            if (statSync(`${dir}/${preview}`).size > 400 * 1024) fail("The preview picture is over 400 kB.")
            console.log(`${dir} ${manifest.version}: the folder looks like a template. The full check runs on Protonist\u0027s runner.`)
          '
